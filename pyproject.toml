[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "globalpcd"
version = "0.1.0"
description = "Passive cavitation detection (PCD) prototype toolkit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Siobhan K Cronin" },
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
openlifu = ["openlifu-sdk"]

[tool.setuptools]
packages = ["pcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
