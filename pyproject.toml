[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "globalpcd"
version = "0.1.1"
description = "Cavitation safety monitor for focused-ultrasound controllers (PCDReading contract)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Siobhan K Cronin" },
]
keywords = [
    "passive cavitation detection",
    "focused ultrasound",
    "neuromodulation",
    "safety monitoring",
    "openlifu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]
openlifu = ["openlifu-sdk"]

[project.urls]
Homepage = "https://github.com/SioKCronin/globalpcd"
Documentation = "https://github.com/SioKCronin/globalpcd/blob/master/docs/PCDREADING.md"
Changelog = "https://github.com/SioKCronin/globalpcd/blob/master/CHANGELOG.md"
Issues = "https://github.com/SioKCronin/globalpcd/issues"

[tool.setuptools]
packages = ["pcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
